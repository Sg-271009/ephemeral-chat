<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #121212;
      color: #eee;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #calc-box {
      width: 300px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 16px;
    }
    #disp {
      width: 100%;
      height: 60px;
      background: #111;
      color: #fff;
      font-size: 28px;
      text-align: right;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid #333;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn {
      padding: 16px 0;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #2c2c2c;
      color: #fff;
      cursor: pointer;
    }
    .op { background: #3a3f4b; color: #7cc4fa; }
    .eq { background: #2b6cb0; }
    .clr { background: #742a2a; }
    #chat-box {
      display: none;
      width: 100%;
      max-width: 560px;
      padding: 16px;
    }
    .row { display: flex; gap: 6px; align-items: center; }
    input, button {
      padding: 10px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
    }
    button { cursor: pointer; background: #2b6cb0; border: none; }
    #chat {
      border: 1px solid #333;
      height: 340px;
      overflow-y: auto;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      background: #181818;
    }
    .msg {
      background: #2a2a2a;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .time { font-size: 11px; color: #888; margin-left: 8px; }
    #admin-panel {
      display: none;
      background: #2a1616;
      border: 1px solid #742a2a;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="calc-box">
    <div id="disp">0</div>
    <div class="grid">
      <button class="btn clr" onclick="clr()">C</button>
      <button class="btn op" onclick="put('(')">(</button>
      <button class="btn op" onclick="put(')')">)</button>
      <button class="btn op" onclick="put('/')">÷</button>
      <button class="btn" onclick="put('7')">7</button>
      <button class="btn" onclick="put('8')">8</button>
      <button class="btn" onclick="put('9')">9</button>
      <button class="btn op" onclick="put('*')">×</button>
      <button class="btn" onclick="put('4')">4</button>
      <button class="btn" onclick="put('5')">5</button>
      <button class="btn" onclick="put('6')">6</button>
      <button class="btn op" onclick="put('-')">-</button>
      <button class="btn" onclick="put('1')">1</button>
      <button class="btn" onclick="put('2')">2</button>
      <button class="btn" onclick="put('3')">3</button>
      <button class="btn op" onclick="put('+')">+</button>
      <button class="btn" onclick="put('0')">0</button>
      <button class="btn" onclick="put('.')">.</button>
      <button class="btn" onclick="back()">⌫</button>
      <button class="btn eq" onclick="calc()">=</button>
    </div>
  </div>

  <div id="chat-box">
    <div class="row">
      <input id="room" style="flex:1" placeholder="合言葉を入力" />
      <button onclick="joinRoom()">入室</button>
      <button style="background:#333" onclick="lockCalc()">電卓へ</button>
      <button style="background:#222;color:#777" onclick="toggleAdmin()">⚙</button>
    </div>
    <div id="admin-panel">
      <div class="row">
        <input id="admin-pass" type="password" style="flex:1" placeholder="管理者パスワード" />
        <button style="background:#c53030" onclick="wipeAll()">ワンタップ全消し</button>
      </div>
    </div>
    <div id="chat"></div>
    <div class="row">
      <input id="text" style="flex:1" placeholder="メッセージ（100分で自動消去）" onkeydown="if(event.key==='Enter')sendMsg()" />
      <button onclick="sendMsg()">送信</button>
    </div>
  </div>

  <script>
    let expr = "";
    const disp = document.getElementById("disp");

    function put(v) {
      expr += v;
      disp.textContent = expr;
    }
    function clr() {
      expr = "";
      disp.textContent = "0";
    }
    function back() {
      expr = expr.slice(0, -1);
      disp.textContent = expr || "0";
    }
    function lockCalc() {
      document.getElementById("chat").innerHTML = "";
      document.getElementById("chat-box").style.display = "none";
      document.getElementById("admin-panel").style.display = "none";
      document.getElementById("calc-box").style.display = "block";
      clr();
    }
    function calc() {
      if (expr === "271009") {
        clr();
        document.getElementById("calc-box").style.display = "none";
        document.getElementById("chat-box").style.display = "block";
        return;
      }
      try {
        if (!/^[0-9+\-*/().\s]+$/.test(expr)) throw 0;
        const r = Function("return (" + expr + ")")();
        expr = String(r);
        disp.textContent = expr;
      } catch (e) {
        disp.textContent = "Error";
        expr = "";
      }
    }

    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(proto + "//" + location.host);
    const EXPIRE_MS = 100 * 60 * 1000;

    function joinRoom() {
      const room = document.getElementById("room").value.trim();
      if (!room) return;
      document.getElementById("chat").innerHTML = "";
      ws.send(JSON.stringify({ type: "join", room }));
      addSys("合言葉「" + room + "」に入室しました");
    }
    function sendMsg() {
      const i = document.getElementById("text");
      const t = i.value.trim();
      if (!t) return;
      ws.send(JSON.stringify({ type: "chat", text: t }));
      i.value = "";
    }
    function toggleAdmin() {
      const p = document.getElementById("admin-panel");
      p.style.display = p.style.display === "block" ? "none" : "block";
    }
    function wipeAll() {
      const pass = document.getElementById("admin-pass").value;
      if (!pass) return;
      ws.send(JSON.stringify({ type: "wipe", pass }));
      document.getElementById("admin-pass").value = "";
    }
    function addSys(t) {
      const d = document.createElement("div");
      d.style.color = "#888";
      d.style.fontSize = "13px";
      d.style.marginBottom = "8px";
      d.textContent = t;
      document.getElementById("chat").appendChild(d);
    }

    ws.onmessage = (e) => {
      const d = JSON.parse(e.data);
      if (d.type === "chat") {
        const b = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = "msg";
        div.textContent = d.text;
        const s = document.createElement("span");
        s.className = "time";
        s.textContent = "(100分後に消去)";
        div.appendChild(s);
        b.appendChild(div);
        b.scrollTop = b.scrollHeight;
        setTimeout(() => div.remove(), EXPIRE_MS);
      } else if (d.type === "wiped") {
        lockCalc();
      }
    };
  </script>
</body>
</html>
